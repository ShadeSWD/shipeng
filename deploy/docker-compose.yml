# name обязателен (иначе конфликт компоузов на сервере)
name: shipeng

services:
  web:
    image: nginx:alpine
    container_name: shipeng-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
